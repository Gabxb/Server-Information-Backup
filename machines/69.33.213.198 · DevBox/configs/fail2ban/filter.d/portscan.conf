# Match nftables log lines emitted by /usr/local/sbin/f2b-portscan-log.sh
#
# Example:
#   f2b-pscan: IN=eth0 OUT= MAC=... SRC=1.2.3.4 DST=10.0.0.1 PROTO=TCP SPT=12345 DPT=9999 SYN

[INCLUDES]
before = common.conf

[Definition]
failregex = f2b-pscan:.*\bSRC=<HOST>\b
ignoreregex =
journalmatch = _TRANSPORT=kernel
datepattern = {^LN-BEG}EPOCH
